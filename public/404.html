<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 ページが見つかりません | わんわんとリスト</title>

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: 20px;
        background-color: #F6F5EE;
        color: #4F5A4C;
        font-family: sans-serif;
      }

      .error-card {
        width: 100%;
        max-width: 440px;
        box-sizing: border-box;
        padding: 48px 24px;
        text-align: center;
        background-color: white;
        border-radius: 24px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      }

      .error-code {
        margin: 0 0 16px;
        font-size: 64px;
        font-weight: bold;
        color: #A8BFA0;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 20px;
      }

      .error-message {
        margin: 0 0 32px;
        font-size: 14px;
        line-height: 1.8;
        color: #697467;
      }

      .back-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 24px;
        border-radius: 9999px;
        background-color: #A8BFA0;
        color: #354133;
        font-size: 14px;
        font-weight: bold;
        text-decoration: none;
        transition: background-color 0.2s;
      }

      .back-button:hover {
        background-color: #96AE8E;
      }

      .back-button:focus-visible {
        outline: 2px solid #4F5A4C;
        outline-offset: 4px;
      }
    </style>
  </head>

  <body>
    <main class="error-card">
      <p class="error-code">404</p>

      <h1>ページが見つかりませんでした</h1>

      <p class="error-message">
        お探しのページは存在しないか、<br>
        移動した可能性があります。
      </p>

      <a href="/" class="back-button">
        トップページへ戻る →
      </a>
    </main>
  </body>
</html>
